<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.02); }
      }

      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      @keyframes floatCard2 {
        0%, 100% { transform: translateY(-4px); }
        50% { transform: translateY(3px); }
      }

      @keyframes floatCard3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      @keyframes flowPackets {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes liveDot {
        0%, 100% { r: 4px; opacity: 1; }
        50% { r: 7px; opacity: 0.4; }
      }

      @keyframes printTicket {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(4px); }
      }

      .card-1 { animation: floatCard1 4s ease-in-out infinite; }
      .card-2 { animation: floatCard2 4.5s ease-in-out infinite; }
      .card-3 { animation: floatCard3 5s ease-in-out infinite; }
      .flow-line {
        stroke-dasharray: 8 8;
        animation: flowPackets 2.5s linear infinite;
      }
      .beacon { animation: liveDot 2s ease-in-out infinite; }
      .paper-feed { animation: printTicket 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="360" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="80" r="120" fill="#10b981" opacity="0.08" filter="url(#glowEmerald)" />
  <circle cx="800" cy="240" r="140" fill="#f59e0b" opacity="0.08" filter="url(#glowAmber)" />

  <!-- Grid Dots pattern -->
  <g opacity="0.1" fill="#94a3b8">
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" />
    </pattern>
    <rect width="1000" height="360" fill="url(#dotPattern)" />
  </g>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(48, 48)">
    <!-- Logo Badge -->
    <rect x="0" y="0" width="46" height="46" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <path d="M 16 14 L 16 26 M 20 14 L 20 26 M 24 14 L 24 26 M 16 26 C 16 30, 24 30, 24 26 L 24 34 M 30 14 L 30 34"
          stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Title & Tagline -->
    <text x="60" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="-0.5">
      MINI RESTAURANT POS
    </text>
    <text x="60" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" fill="#94a3b8">
      Dine-In Table Map • Multi-Round KOT • Kitchen Display (KDS) • 58mm/80mm Thermal Receipts
    </text>

    <!-- Live Status Indicator Pill -->
    <g transform="translate(740, 6)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle class="beacon" cx="20" cy="16" r="4.5" fill="#10b981" />
      <text x="34" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#10b981">
        WEBSOCKET LIVE
      </text>
    </g>
  </g>

  <!-- ================= ANIMATED FLOW PIPELINE ================= -->
  <!-- Connection Paths -->
  <path class="flow-line" d="M 290 220 L 400 220" stroke="#10b981" stroke-width="2.5" fill="none" stroke-opacity="0.7" />
  <path class="flow-line" d="M 610 220 L 710 220" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-opacity="0.7" />

  <!-- Node 1: Interactive Table (Floor Map) -->
  <g class="card-1" transform="translate(60, 135)">
    <rect width="230" height="170" rx="18" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))" />
    <rect x="14" y="14" width="70" height="24" rx="8" fill="#10b981" fill-opacity="0.18" />
    <text x="24" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#34d399">OCCUPIED</text>
    <text x="14" y="65" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff">Table T-02</text>
    <text x="14" y="82" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Window Booth • 4 Seats</text>

    <!-- Order Items Summary -->
    <rect x="14" y="96" width="202" height="58" rx="10" fill="#0b1120" stroke="#1e293b" />
    <text x="24" y="116" font-family="sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">2x Double Smash Burger</text>
    <text x="24" y="132" font-family="sans-serif" font-size="10" font-weight="500" fill="#38bdf8">1x Mint Lemonade</text>
    <text x="170" y="142" font-family="sans-serif" font-size="12" font-weight="800" fill="#10b981">$32.50</text>
  </g>

  <!-- Node 2: Live Kitchen KOT (KDS Screen) -->
  <g class="card-2" transform="translate(400, 135)">
    <rect width="210" height="170" rx="18" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.8" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))" />
    <rect x="14" y="14" width="60" height="24" rx="8" fill="#f59e0b" fill-opacity="0.2" />
    <text x="22" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#fbbf24">COOKING</text>
    <text x="14" y="65" font-family="sans-serif" font-size="17" font-weight="900" fill="#ffffff">KOT #004 (Round 2)</text>
    <text x="14" y="82" font-family="sans-serif" font-size="11" font-weight="500" fill="#fde68a">Time elapsed: 4m 12s</text>

    <rect x="14" y="96" width="182" height="58" rx="10" fill="#0b1120" stroke="#1e293b" />
    <text x="24" y="116" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">1x Loaded Truffle Fries</text>
    <text x="24" y="132" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#ef4444">*NOTE: Extra crispy, no dip</text>
    <text x="24" y="146" font-family="sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Server: Sarah M.</text>
  </g>

  <!-- Node 3: Thermal Receipt & Settlement -->
  <g class="card-3" transform="translate(710, 135)">
    <rect width="230" height="170" rx="18" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.8" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.5))" />
    <rect x="14" y="14" width="80" height="24" rx="8" fill="#6366f1" fill-opacity="0.2" />
    <text x="22" y="30" font-family="sans-serif" font-size="10" font-weight="800" fill="#818cf8">SETTLEMENT</text>
    <text x="14" y="65" font-family="sans-serif" font-size="17" font-weight="900" fill="#ffffff">Receipt Print (80mm)</text>
    <text x="14" y="82" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Cash / Card / QR Code</text>

    <!-- Simulated Receipt Roll Paper Feed -->
    <g class="paper-feed">
      <rect x="14" y="96" width="202" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <text x="24" y="114" font-family="monospace" font-size="9" font-weight="800" fill="#0f172a">TOTAL DUE:  $34.12</text>
      <text x="24" y="128" font-family="monospace" font-size="8.5" fill="#334155">CASH TENDERED: $40.00</text>
      <text x="24" y="142" font-family="monospace" font-size="8.5" font-weight="700" fill="#16a34a">CHANGE DUE:    $5.88</text>
    </g>
  </g>
</svg>

